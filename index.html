<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Get Off of My Lawn - WebXR Target Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    #VRButton, #ARButton {
      position: absolute !important;
      bottom: 20px !important;
      width: 140px !important;
      padding: 12px 6px !important;
      font-size: 13px !important;
      font-weight: bold !important;
    }

    #VRButton {
      left: calc(50% - 150px) !important;
    }

    #ARButton {
      left: calc(50% + 10px) !important;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // GAME VERSION
    const GAME_VERSION = "v3.25.0";

    let scene, camera, renderer, controls;
    let cameraRig; 
    
    let controllers = [];
    let gunPivots = [];
    let laserLines = [];
    let tracers = [];
    let hudButtons = [];
    let score = 0;
    let lawnMesh = null;
    let fenceGroup = null;
    let hudGroup = null;
    let flowers = []; // Array for flowers
    
    let gameState = 'LOBBY';

    let currentGunPitch = THREE.MathUtils.degToRad(-14);
    let laserEnabled = true;
    let activeHand = 'right';

    let controllerRight = null;
    let controllerLeft = null;

    let audioCtx = null;

    let hudCanvas, hudCtx, hudTexture;
    let btnPitchDownMesh, btnPitchUpMesh, btnHandToggleMesh, btnStartMesh, btnLaserMesh;

    let logoMesh = null;

    let activeAnimals = [];
    let flyingRagdolls = [];
    let poops = [];
    let spawnTimer = 0;
    let survivalTime = 0;
    let difficultyMultiplier = 1.0;

    const MAX_POOPS = 5;

    const textureCache = {};
    const textureLoader = new THREE.TextureLoader();
    const AVAILABLE_IMAGES = ['a21', 'b21', 'c41', 'd31', 'e11', 'f11', 'g31'];

    const SIZE_MAP = {
      1: { scale: 0.30, points: 200, speed: 0.85 },
      2: { scale: 0.55, points: 150, speed: 1.0 },
      3: { scale: 0.90, points: 100, speed: 0.7 },
      4: { scale: 1.35, points: 50,  speed: 0.4 }
    };

    const clock = new THREE.Clock();

    function getAnimalTexture(fileName) {
      if (!textureCache[fileName]) {
        const texture = textureLoader.load(`${fileName}.png`, undefined, undefined, () => {
          console.warn(`Image ${fileName}.png not found.`);
        });
        texture.colorSpace = THREE.SRGBColorSpace;
        textureCache[fileName] = texture;
      }
      return textureCache[fileName];
    }

    init();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a2634);

      cameraRig = new THREE.Group();
      scene.add(cameraRig);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      cameraRig.add(camera);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffaed, 1.4);
      dirLight.position.set(5, 12, 6);
      scene.add(dirLight);

      createLawnAndFence();
      createFlowers(); // Genera i fiori

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor');

      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      cameraRig.position.set(0, 1.6, 0); 
      controls.target.set(0, 0, -2.5);
      controls.update();

      renderer.xr.addEventListener('sessionstart', () => {
        const session = renderer.xr.getSession();
        controls.enabled = false;
        cameraRig.position.set(0, 0, 0);
      });

      renderer.xr.addEventListener('sessionend', () => {
        controls.enabled = true;
        cameraRig.position.set(0, 1.6, 0);
        controls.target.set(0, 0, -2.5);
        controls.update();
      });

      const xrOptions = { requiredFeatures: ['local-floor'] };
      document.body.appendChild(VRButton.createButton(renderer, xrOptions));
      document.body.appendChild(ARButton.createButton(renderer, xrOptions));

      setupControllers();
      create3DHUD();
      createPresentationLogo();
      updateGunVisibility();
      updateGunRotation();

      gameState = 'LOBBY';
      updateHudTexture();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', initAudio, { once: true });
      window.addEventListener('pointerdown', onDesktopShoot);

      renderer.setAnimationLoop(animate);
    }

    function createLawnAndFence() {
      const lawnGeo = new THREE.PlaneGeometry(3.0, 3.0);
      const lawnMat = new THREE.MeshStandardMaterial({ color: 0x38761d, roughness: 0.9, metalness: 0.1 });
      lawnMesh = new THREE.Mesh(lawnGeo, lawnMat);
      lawnMesh.rotation.x = -Math.PI / 2;
      lawnMesh.position.set(0, 0, -3.0);
      scene.add(lawnMesh);

      fenceGroup = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
      const halfSize = 1.5;
      const postGeo = new THREE.BoxGeometry(0.06, 0.45, 0.06);
      const plankGeo = new THREE.BoxGeometry(3.0, 0.08, 0.02);

      const sides = [
        { rot: 0, pos: [0, 0, -3.0 - halfSize] },
        { rot: Math.PI / 2, pos: [halfSize, 0, -3.0] },
        { rot: 0, pos: [0, 0, -3.0 + halfSize] },
        { rot: Math.PI / 2, pos: [-halfSize, 0, -3.0] }
      ];

      sides.forEach(s => {
        const sideGroup = new THREE.Group();
        sideGroup.position.set(...s.pos);
        sideGroup.rotation.y = s.rot;
        for (let x = -halfSize; x <= halfSize; x += 1.0) {
          const post = new THREE.Mesh(postGeo, woodMat);
          post.position.set(x, 0.225, 0);
          sideGroup.add(post);
        }
        const p1 = new THREE.Mesh(plankGeo, woodMat);
        p1.position.set(0, 0.15, 0);
        const p2 = new THREE.Mesh(plankGeo, woodMat);
        p2.position.set(0, 0.32, 0);
        sideGroup.add(p1, p2);
        fenceGroup.add(sideGroup);
      });
      scene.add(fenceGroup);
    }

    // NUOVA FUNZIONE PER CREARE I FIORI
    function createFlowers() {
      const tex = textureLoader.load('fiori.png');
      tex.colorSpace = THREE.SRGBColorSpace;
      const geo = new THREE.PlaneGeometry(0.3, 0.3); // Dimensione taglia 1
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide });

      for(let i = 0; i < 10; i++) {
        const flower = new THREE.Mesh(geo, mat);
        // Posizionamento casuale entro i limiti del prato (3x3 centrato su 0, -3)
        const x = (Math.random() - 0.5) * 2.4;
        const z = -3.0 + (Math.random() - 0.5) * 2.4;
        flower.position.set(x, 0.15, z);
        flower.userData = {
           baseY: 0.15,
           wobbleSpeed: 4 + Math.random() * 2
        };
        scene.add(flower);
        flowers.push(flower);
      }
    }

    function createPoopModel(x, z, scaleFactor = 1.0) {
      const poopGroup = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x4a2c11, roughness: 0.9 });
      const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.04, 8), mat);
      b1.position.y = 0.02;
      const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.03, 8), mat);
      b2.position.y = 0.05;
      const b3 = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.04, 8), mat);
      b3.position.y = 0.08;
      poopGroup.add(b1, b2, b3);
      poopGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
      poopGroup.position.set(x, 0, z);
      scene.add(poopGroup);
      poops.push(poopGroup);
    }

    function startGame() {
      cleanupGame();
      gameState = 'PLAYING';
      score = 0;
      spawnTimer = 0;
      survivalTime = 0;
      difficultyMultiplier = 1.0;
      if (logoMesh) logoMesh.visible = false;
      updateHudTexture();
      update3DButtonText(btnStartMesh, "⏹ STOP GAME", "#ff2a6d");
    }

    function stopGame() {
      cleanupGame();
      gameState = 'LOBBY';
      if (logoMesh) logoMesh.visible = true;
      updateHudTexture();
      update3DButtonText(btnStartMesh, "▶ START GAME", "#00ffcc");
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      updateHudTexture();
      setTimeout(() => { stopGame(); }, 3500);
    }

    function triggerHabitatGameOver() {
      gameState = 'HABITAT_GAMEOVER';
      updateHudTexture();
      setTimeout(() => { stopGame(); }, 3500);
    }

    function cleanupGame() {
      activeAnimals.forEach(a => { scene.remove(a); a.geometry.dispose(); a.material.dispose(); });
      activeAnimals = [];
      flyingRagdolls.forEach(f => { scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); });
      flyingRagdolls = [];
      poops.forEach(p => { scene.remove(p); p.traverse(c => { if(c.geometry) c.geometry.dispose(); if(c.material) c.material.dispose(); }); });
      poops = [];
    }

    function spawnAnimalFromOutside() {
      if (AVAILABLE_IMAGES.length === 0) return;
      const baseName = AVAILABLE_IMAGES[Math.floor(Math.random() * AVAILABLE_IMAGES.length)];
      const sizeDigit = parseInt(baseName.charAt(1), 10) || 2;
      const sizeData = SIZE_MAP[sizeDigit] || SIZE_MAP[2];

      const planeGeo = new THREE.PlaneGeometry(sizeData.scale, sizeData.scale);
      const planeMat = new THREE.MeshBasicMaterial({ map: getAnimalTexture(baseName), transparent: true, alphaTest: 0.1, side: THREE.DoubleSide });
      const animalMesh = new THREE.Mesh(planeGeo, planeMat);

      const fromLeft = Math.random() > 0.5;
      const spawnDistance = 3.0;
      const startX = fromLeft ? -spawnDistance : spawnDistance;
      const trackZ = -3.0 + (Math.random() - 0.5) * 1.5;

      if (fromLeft) animalMesh.scale.x = -1;
      animalMesh.position.set(startX, sizeData.scale / 2, trackZ);

      animalMesh.userData = {
        active: true, points: sizeData.points, speed: sizeData.speed * difficultyMultiplier,
        dirX: fromLeft ? 1 : -1, targetX: fromLeft ? 2.0 : -2.0, poopTargetX: (Math.random() - 0.5) * 0.6,
        state: 'WALKING_IN', baseY: sizeData.scale / 2, wobbleSpeed: 12 + Math.random() * 6,
        sizeScaleFactor: sizeData.scale / 0.55, texFrame2: getAnimalTexture(`${baseName.charAt(0)}${sizeDigit}2`)
      };
      scene.add(animalMesh);
      activeAnimals.push(animalMesh);
    }

    function createPresentationLogo() {
      const logoGeo = new THREE.PlaneGeometry(1, 1);
      const logoMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.05, side: THREE.DoubleSide });
      logoMesh = new THREE.Mesh(logoGeo, logoMat);
      logoMesh.position.set(0, 1.0, -3.0);
      scene.add(logoMesh);
      textureLoader.load('logo.png', (texture) => { logoMat.map = texture; logoMesh.scale.set(0.8, 0.8, 1); }, undefined, () => {
        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 360;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(20, 40, 20, 0.95)'; ctx.fillRect(10, 10, 492, 340);
        ctx.strokeStyle = '#478c2e'; ctx.lineWidth = 6; ctx.strokeRect(10, 10, 492, 340);
        ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center'; ctx.fillText('GET OFF OF MY LAWN!', 256, 50);
        ctx.fillStyle = '#00ff66'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'left';
        ctx.fillText('GAME RULES:', 30, 85);
        ctx.fillStyle = '#ffffff'; ctx.font = '14px Arial';
        ctx.fillText('• Use hand trigger to select hand.', 30, 115);
        ctx.fillText('• Shoot animals ONLY inside fence.', 30, 140);
        ctx.fillText('• Hit outside = Demerit note.', 30, 165);
        logoMat.map = new THREE.CanvasTexture(canvas);
      });
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function create3DHUD() {
      hudGroup = new THREE.Group();
      // HUD spostato più a sinistra e più in basso
      hudGroup.position.set(-1.0, 0.4, -1.2);
      hudGroup.rotation.y = THREE.MathUtils.degToRad(25);

      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 600; hudCanvas.height = 340;
      hudCtx = hudCanvas.getContext('2d');
      hudTexture = new THREE.CanvasTexture(hudCanvas);

      const panelMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.68),
        new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide })
      );
      hudGroup.add(panelMesh);

      btnPitchDownMesh = create3DButton("Pitch Down ⤵", 0.28, 0.11);
      btnPitchDownMesh.position.set(-0.35, -0.45, 0);
      btnPitchDownMesh.userData = { action: 'pitch_down' };
      hudGroup.add(btnPitchDownMesh); hudButtons.push(btnPitchDownMesh);

      btnPitchUpMesh = create3DButton("Pitch Up ⤴", 0.28, 0.11);
      btnPitchUpMesh.position.set(0, -0.45, 0);
      btnPitchUpMesh.userData = { action: 'pitch_up' };
      hudGroup.add(btnPitchUpMesh); hudButtons.push(btnPitchUpMesh);

      btnHandToggleMesh = create3DButton("Left Hand", 0.28, 0.11, "#00ffff");
      btnHandToggleMesh.position.set(0.35, -0.45, 0);
      btnHandToggleMesh.userData = { action: 'toggle_hand' };
      hudGroup.add(btnHandToggleMesh); hudButtons.push(btnHandToggleMesh);

      btnLaserMesh = create3DButton(laserEnabled ? "Laser: ON" : "Laser: OFF", 0.28, 0.11, "#ff0000");
      btnLaserMesh.position.set(-0.2, -0.60, 0);
      btnLaserMesh.userData = { action: 'toggle_laser' };
      hudGroup.add(btnLaserMesh); hudButtons.push(btnLaserMesh);

      btnStartMesh = create3DButton("▶ START GAME", 0.28, 0.11, "#00ffcc");
      btnStartMesh.position.set(0.2, -0.60, 0);
      btnStartMesh.userData = { action: 'toggle_start' };
      hudGroup.add(btnStartMesh); hudButtons.push(btnStartMesh);

      cameraRig.add(hudGroup); 
    }

    function toggleLaser() {
      laserEnabled = !laserEnabled;
      laserLines.forEach(line => line.visible = laserEnabled);
      update3DButtonText(btnLaserMesh, laserEnabled ? "Laser: ON" : "Laser: OFF", "#ff0000");
    }

    function setupControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        const pivot = new THREE.Group();
        pivot.add(createRedGunModel());
        controller.add(pivot);
        controller.addEventListener('selectstart', onXRShoot);
        controller.addEventListener('connected', (event) => {
          if (event.data.handedness === 'right') controllerRight = controller;
          else if (event.data.handedness === 'left') controllerLeft = controller;
          updateGunVisibility();
        });
        cameraRig.add(controller);
        controllers.push(controller);
        gunPivots.push(pivot);
      }
    }

    function updateGunVisibility() {
      if (controllerRight) controllerRight.visible = (activeHand === 'right');
      if (controllerLeft) controllerLeft.visible = (activeHand === 'left');
    }

    function toggleHand() {
      activeHand = (activeHand === 'right') ? 'left' : 'right';
      updateGunVisibility();
      update3DButtonText(btnHandToggleMesh, activeHand === 'right' ? "Use Left Hand" : "Use Right Hand", "#00ffff");
    }

    function update3DButtonText(btnMesh, label, colorHex = '#00ff66') {
      const ctx = btnMesh.userData.ctx;
      ctx.fillStyle = '#142a14'; ctx.fillRect(0, 0, 300, 100);
      ctx.strokeStyle = colorHex; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 292, 92);
      ctx.fillStyle = colorHex; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 150, 50);
      btnMesh.userData.texture.needsUpdate = true;
    }

    function createRedGunModel() {
      const gunGroup = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xe60000, roughness: 0.2 });
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.2, 16).rotateX(Math.PI/2), mat);
      barrel.position.z = -0.1;
      gunGroup.add(barrel);
      const laser = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-15)]), new THREE.LineBasicMaterial({ color: 0xff0000 }));
      laser.visible = laserEnabled;
      gunGroup.add(laser);
      laserLines.push(laser);
      return gunGroup;
    }

    function onXRShoot(event) {
      const controller = event.target;
      if (activeHand === 'right' && controller !== controllerRight) return;
      if (activeHand === 'left' && controller !== controllerLeft) return;

      const pivot = controller.children.find(c => gunPivots.includes(c));
      if (!pivot) return;

      const origin = new THREE.Vector3(); const worldQuat = new THREE.Quaternion();
      pivot.getWorldPosition(origin); pivot.getWorldQuaternion(worldQuat);
      processShot(origin, new THREE.Vector3(0, 0, -1).applyQuaternion(worldQuat));
    }

    function onDesktopShoot(event) {
      if (renderer.xr.isPresenting) return;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(mouse, camera);
      processShot(raycaster.ray.origin, raycaster.ray.direction);
    }

    function processShot(origin, direction) {
      playGunshotSound();
      const raycaster = new THREE.Raycaster(origin, direction);
      const hits = raycaster.intersectObjects([...activeAnimals.filter(a => a.userData.active), ...hudButtons], false);
      if (hits.length > 0) {
        const hit = hits[0];
        if (hudButtons.includes(hit.object)) {
          const act = hit.object.userData.action;
          if (act === 'pitch_down') { currentGunPitch += 0.017; updateGunRotation(); }
          else if (act === 'pitch_up') { currentGunPitch -= 0.017; updateGunRotation(); }
          else if (act === 'toggle_hand') toggleHand();
          else if (act === 'toggle_laser') toggleLaser();
          else if (act === 'toggle_start') { if (gameState === 'PLAYING') stopGame(); else startGame(); }
        } else if (gameState === 'PLAYING') {
           if (Math.abs(hit.object.position.x) > 1.5) triggerHabitatGameOver();
           else { score += hit.object.userData.points; playYeetSound(); hit.object.userData.active = false; activeAnimals.splice(activeAnimals.indexOf(hit.object), 1); scene.remove(hit.object); }
        }
      }
      createTracer(origin, origin.clone().add(direction.multiplyScalar(20)));
    }

    function updateGunRotation() { gunPivots.forEach(pivot => { pivot.rotation.x = currentGunPitch; }); updateHudTexture(); }
    function updateHudTexture() {
      hudCtx.fillStyle = '#0f1a0f'; hudCtx.fillRect(0, 0, 600, 340);
      hudCtx.strokeStyle = '#00ff66'; hudCtx.lineWidth = 8; hudCtx.strokeRect(4, 4, 592, 332);
      hudCtx.fillStyle = '#ffcc00'; hudCtx.font = 'bold 26px Arial'; hudCtx.fillText('GET OFF OF MY LAWN!', 28, 40);
      hudCtx.fillStyle = '#00ffff'; hudCtx.fillText('Time: ' + Math.floor(survivalTime/60)+':'+Math.floor(survivalTime%60), 28, 75);
      hudCtx.fillStyle = '#00ff66'; hudCtx.fillText('Status: ' + (gameState === 'PLAYING' ? 'DEFENDING' : 'LOBBY'), 28, 110);
      hudCtx.fillStyle = '#ffcc00'; hudCtx.fillText('Poop: ' + poops.length + '/' + MAX_POOPS, 28, 145);
      hudCtx.fillStyle = '#00ff66'; hudCtx.fillText('Score: ' + score, 28, 180);
      hudTexture.needsUpdate = true;
    }

    function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
    
    function animate() {
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();
      
      // ANIMAZIONE FIORI
      flowers.forEach(f => {
         f.position.y = f.userData.baseY + Math.sin(time * f.userData.wobbleSpeed) * 0.02;
      });

      if (gameState === 'PLAYING') {
         survivalTime += delta;
         difficultyMultiplier = 1.0 + (survivalTime * 0.03);
         const currentSpawnInterval = Math.max(0.3, 1.0 - (survivalTime * 0.01));
         spawnTimer += delta;
         if (spawnTimer >= currentSpawnInterval) { spawnTimer = 0; spawnAnimalFromOutside(); }
         activeAnimals.forEach((a, i) => {
            a.position.x += a.userData.dirX * a.userData.speed * delta;
            a.position.y = a.userData.baseY + Math.sin(time * a.userData.wobbleSpeed) * 0.04;
            if (a.userData.state === 'WALKING_IN' && ((a.userData.dirX > 0 && a.position.x >= a.userData.poopTargetX) || (a.userData.dirX < 0 && a.position.x <= a.userData.poopTargetX))) {
                a.userData.state = 'POOPING'; a.userData.poopTimer = 0.5;
            } else if (a.userData.state === 'POOPING') {
                a.userData.poopTimer -= delta; if (a.userData.poopTimer <= 0) { createPoopModel(a.position.x, a.position.z, a.userData.sizeScaleFactor); playPoopSound(); a.userData.state = 'WALKING_OUT'; if (poops.length >= MAX_POOPS) triggerGameOver(); }
            }
         });
         updateHudTexture();
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
